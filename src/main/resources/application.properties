spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:crmbandas;DB_CLOSE_DELAY=-1}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# Fuerza el driver de PostgreSQL solo si existe la variable de Railway, si no usa H2
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



server.port=${PORT:8080}