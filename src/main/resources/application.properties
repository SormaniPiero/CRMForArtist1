# En local usa H2; en producción las variables de entorno sustituyen los valores
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:crmbandas;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Dialecto fallback para evitar el error de metadata si la conexión tarda
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto dinámico para el proveedor Cloud (Render/Railway)
server.port=${PORT:8080}