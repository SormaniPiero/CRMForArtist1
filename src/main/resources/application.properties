# En local (sin variables de entorno) usa H2 en memoria, igual que hasta ahora.
# En Railway, las variables de entorno que configures ahi pisan estos valores por defecto.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:crmbandas;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Railway asigna el puerto mediante la variable de entorno PORT
server.port=${PORT:8080}
